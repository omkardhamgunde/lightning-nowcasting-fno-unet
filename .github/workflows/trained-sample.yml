name: Verify trained sample
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  real-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==1.26.4
      - run: python -m scripts.download_assets --output sample_assets
      - run: python -m scripts.verify_sample --assets sample_assets --device cpu
